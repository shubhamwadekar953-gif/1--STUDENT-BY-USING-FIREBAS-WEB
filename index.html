<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student by using firebase web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="h2 p-2 mb-5 text-center">STUDENT FORM BY USING FIREBASE WEB</h2>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4">
                <form id="stdForm">
                    <div class="card">
                        <h3 class="bg-dark text-white text-center h3 p-1">STUDENT FORM</h3>
                        <div class="card-body">
                            <div class="form-group mb-3">
                                <label for="fname">First Name:</label>
                                <input type="text" class="form-control" id="fname">
                            </div>
                            <div class="form-group mb-3">
                                <label for="lname">Last Name:</label>
                                <input type="text" class="form-control" id="lname">
                            </div>
                            <div class="form-group mb-3">
                                <label for="email">E-mail:</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="form-group mb-5">
                                <label for="contact">Contact No:</label>
                                <input type="number" class="form-control" id="contact">
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm" id="submitBtn">Submit</button>
                            <button type="button" class="btn btn-warning btn-sm d-none" id="updateBtn">Update</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <h3 class = "bg-dark text-white text-center p-1">STUDENT FORM IN UI</h3>
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="stdList">
                                <!-- <tr>
                                    <td>shubham</td>
                                    <td>wadekar</td>
                                    <td>shubh@gmail.com</td>
                                    <td>1234566789</td>
                                    <td><button class="btn btn-outline-success btn-sm">Edit</button></td>
                                    <td><button class="btn btn-outline-danger btn-sm">Delete</button></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div> 
    </div>

    <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
